apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-todo-ingress
  namespace: argocd-practice
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django-todo-service
                port:
                  number: 80
